schema: spec-driven

context: |
  Language: zh-CN
  All artifacts must be written in zh-CN.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.
  Ameow uses Rust/GPUI at the repository root; Windows x64/MSVC is verified.
  OpenSpec is the only active formal specification system. Start at openspec/README.md.
  GitHub Issues/Projects/PR manage scope and delivery; Cindy native history handles session recall.
  Read docs/spec-maintenance.md and the relevant capability only. Historical reports are evidence, not authorization.
  Preserve pre-existing changes, accepted binaries, safety/compatibility boundaries and explicit unknowns.
  DESIGN.md and .impeccable/design.json are design references; do not create a parallel formal spec.
  This baseline migration changes no product behavior and claims no new product acceptance.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
