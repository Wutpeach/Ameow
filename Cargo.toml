[package]
name = "ameow"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
name = "ameow_next"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ring = "=0.17.14"
url = "2"
tempfile = "3"
zip = { version = "2", default-features = false, features = ["deflate"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls-native-roots"] }
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_Threading", "Win32_System_IO", "Win32_Networking_WinHttp", "Win32_System_Memory", "Win32_System_Registry", "Win32_Globalization"] }
# GPUI Kit 0.9.0 snapshot: zed f816e1f9263e3a8ef63c4baaa02e1441ce1c6038.
gpui = { package = "gpui-pre", version = "=0.3.11", default-features = false, features = ["windows-manifest"] }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.11", default-features = false }
gpui-base = "=0.9.0"
raw-window-handle = "0.6"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_LibraryLoader", "Win32_System_Com"] }

[profile.dev]
debug = 0

[build-dependencies]
embed-resource = "=3.0.11"

[workspace]
exclude = ["vendor/accesskit_windows"]

[patch.crates-io]
# #32: preserve accessibility during Windows COM callbacks after TLS teardown.
accesskit_windows = { path = "vendor/accesskit_windows" }
