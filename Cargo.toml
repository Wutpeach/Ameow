[package]
name = "ameow"
version = "0.5.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
name = "ameow_next"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ring = "=0.17.14"
url = "2"
psl = "=2.1.258"
tempfile = "3"
zip = { version = "2", default-features = false, features = ["deflate"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls-native-roots"] }
# GPUI Kit 0.9.0 snapshot: zed f816e1f9263e3a8ef63c4baaa02e1441ce1c6038.
gpui = { package = "gpui-pre", version = "=0.3.11", default-features = false, features = ["windows-manifest"] }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.11", default-features = false }
gpui-base = "=0.9.0"
gpui-component = { version = "=0.9.0", default-features = false }
gpui-kit-assets = "=0.9.0"
raw-window-handle = "0.6"
# Reuse GPUI's locked raster stack for cached-pixel transforms, without SVG work per geometry frame.
tiny-skia = { version = "=0.11.4", default-features = false, features = ["std"] }
image = { version = "=0.25.10", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_Threading", "Win32_System_IO", "Win32_Networking_WinHttp", "Win32_System_Memory", "Win32_System_Registry", "Win32_Globalization"] }
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_LibraryLoader", "Win32_System_Com"] }

[target.'cfg(target_os = "macos")'.dependencies]
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.11", default-features = false, features = ["runtime_shaders", "font-kit"] }
flate2 = "1"
libc = "0.2"
objc2 = "=0.6.5"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSAccessibility", "NSApplication", "NSBitmapImageRep", "NSButton", "NSControl", "NSEvent", "NSGraphics", "NSImage", "NSImageRep", "NSMenu", "NSMenuItem", "NSPasteboard", "NSResponder", "NSScreen", "NSStatusBar", "NSStatusBarButton", "NSStatusItem", "NSView", "NSWindow", "NSWorkspace", "objc2-core-foundation"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSArray", "NSData", "NSGeometry", "NSLocale", "NSObject", "NSString", "NSThread", "NSUserDefaults"] }
tar = "0.4"

[profile.dev]
debug = 0

[build-dependencies]
embed-resource = "=3.0.11"
sha2 = "0.10"
serde_json = "1"

[workspace]
exclude = ["vendor/accesskit_windows"]

[patch.crates-io]
# #32: preserve accessibility during Windows COM callbacks after TLS teardown.
accesskit_windows = { path = "vendor/accesskit_windows" }

[features]
# Explicitly isolated local fixtures; forbidden in release builds.
app-update-fixture = []
# Finite local development execution; never present in a release build.
dev-tools = []

[[example]]
name = "session_media_fixture"
required-features = ["app-update-fixture"]
