<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ameow</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body class="ameow-theme-black">
  <main class="ameow-popup">
    <section class="ameow-media-panel" id="mediaPanel">
      <div class="ameow-media-toolbar">
        <div class="ameow-media-tabs" role="tablist" aria-label="Media type">
          <button type="button" class="ameow-media-tab active" data-media-type="video" id="videoMediaTab">Video</button>
          <button type="button" class="ameow-media-tab" data-media-type="audio" id="audioMediaTab">Audio</button>
          <button type="button" class="ameow-media-tab" data-media-type="image" id="imageMediaTab">Image</button>
        </div>
        <button type="button" class="ameow-refresh-button" id="refreshMediaButton">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.65 6.35A7.95 7.95 0 0 0 12 4a8 8 0 1 0 7.45 5.08a1 1 0 0 0-1.86.74A6 6 0 1 1 12 6c1.31 0 2.52.42 3.5 1.13L13.8 8.82a1 1 0 0 0 .7 1.71H19a1 1 0 0 0 1-1V5a1 1 0 0 0-1.7-.7l-.65 2.05Z"/></svg>
          <span class="ameow-sr-only" id="refreshMediaText">Refresh</span>
        </button>
      </div>
      <div class="ameow-media-summary" id="mediaSummary">Scanning current page.</div>
      <div class="ameow-media-preview-slot" id="mediaPreviewSlot" hidden></div>
      <div class="ameow-media-list" id="mediaList"></div>
      <div class="ameow-media-empty" id="mediaEmpty">
        <div class="ameow-empty-mark" aria-hidden="true">o</div>
        <div class="ameow-empty-title" id="mediaEmptyTitle">Scanning</div>
        <div class="ameow-empty-copy" id="mediaEmptyCopy">Checking the active page for media resources.</div>
      </div>
    </section>

    <section class="ameow-compact-controls" aria-label="Popup controls">
      <section class="ameow-control-panel">
        <div class="ameow-control-heading">
          <span class="ameow-tool-label" id="qualitySectionTitle">Quality</span>
          <span class="ameow-tool-value" id="qualitySummaryText">Balanced</span>
        </div>
        <div class="ameow-quality-grid" id="qualityGrid"></div>
        <div class="ameow-quality-hint" id="highestQualityHint" data-visible="false" hidden aria-live="polite" aria-hidden="true">
          <span class="ameow-quality-hint-icon" aria-hidden="true">i</span>
          <span class="ameow-quality-hint-text" id="highestQualityHintText">
            Some high-quality videos may enter the transcode queue after download.
          </span>
        </div>
      </section>
      <section class="ameow-login-state-panel" id="loginStatePanel" data-state="unknown">
        <span class="ameow-login-state-icon" id="loginStateIcon" aria-hidden="true">?</span>
        <div class="ameow-login-state-copy">
          <span class="ameow-tool-label" id="loginStateLabel">Login state</span>
          <span class="ameow-login-state-title" id="loginStateTitle">Current site</span>
          <span class="ameow-login-state-hint" id="loginStateHint">Sync cookies from this browser for better downloads.</span>
        </div>
        <button type="button" class="ameow-login-state-button" id="loginStateButton">
          Sync
        </button>
      </section>
    </section>

    <div class="ameow-image-lightbox" id="imageLightbox" data-open="false" hidden aria-hidden="true" role="dialog" aria-modal="true">
      <button type="button" class="ameow-image-lightbox-backdrop" id="imageLightboxBackdrop" aria-label="Close image preview"></button>
      <div class="ameow-image-lightbox-frame">
        <button type="button" class="ameow-image-lightbox-close" id="imageLightboxClose" aria-label="Close image preview">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.7 5.3L12 10.6l5.3-5.3l1.4 1.4L13.4 12l5.3 5.3l-1.4 1.4L12 13.4l-5.3 5.3l-1.4-1.4l5.3-5.3l-5.3-5.3l1.4-1.4Z"/></svg>
        </button>
        <img id="imageLightboxImage" class="ameow-image-lightbox-image" alt="">
        <div class="ameow-image-lightbox-caption" id="imageLightboxCaption"></div>
      </div>
    </div>

    <footer class="ameow-popup-footer">
      <div class="ameow-footer-slot ameow-footer-slot-left">
        <button type="button" class="ameow-footer-btn" id="openOptionsButton">
          <svg id="footerSettingsIcon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8.25a3.75 3.75 0 1 1 0 7.5a3.75 3.75 0 0 1 0-7.5Zm0-5.25l1.25 2.25c.4.12.78.27 1.15.47l2.47-.72l1.75 3.03l-1.86 1.74c.08.4.12.82.12 1.23s-.04.83-.12 1.23l1.86 1.74l-1.75 3.03l-2.47-.72c-.37.2-.75.35-1.15.47L12 21l-1.25-2.25c-.4-.12-.78-.27-1.15-.47l-2.47.72l-1.75-3.03l1.86-1.74A6.4 6.4 0 0 1 7.12 12c0-.41.04-.83.12-1.23L5.38 9.03L7.13 6l2.47.72c.37-.2.75-.35 1.15-.47L12 3Z"/></svg>
          <span class="ameow-footer-status-dot" id="footerStatusDot" aria-hidden="true" hidden></span>
          <span id="footerSettingsText">Settings</span>
        </button>
      </div>
      <span class="ameow-footer-version" id="popupVersion">v0.0.0</span>
      <div class="ameow-footer-slot ameow-footer-slot-right ameow-footer-more">
        <button type="button" class="ameow-footer-btn" id="moreMenuButton" aria-haspopup="menu" aria-expanded="false">
          <span aria-hidden="true">...</span>
          <span id="footerMoreText">More</span>
        </button>
        <div class="ameow-footer-menu" id="moreMenu" role="menu" data-open="false">
          <button type="button" class="ameow-footer-menu-item" id="repositoryLinkButton" role="menuitem">
            GitHub repository
          </button>
          <button type="button" class="ameow-footer-menu-item" id="gettingStartedLinkButton" role="menuitem">
            Getting started
          </button>
        </div>
      </div>
    </footer>
  </main>
  <script src="direct-download-quality.js"></script>
  <script src="download-capability-utils.js"></script>
  <script src="locale-utils.js"></script>
  <script src="site-session-icons.js"></script>
  <script src="popup.js"></script>
</body>
</html>
